name: Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without leading v)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      release_id: ${{ steps.ver.outputs.release_id }}
    steps:
      - id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION#v}"
          fi

          # Remove any stale release/draft for this tag (e.g. after force-pushing a tag)
          for old_id in $(gh api --paginate "repos/${GH_REPO}/releases" --jq ".[] | select(.tag_name == \"${TAG}\") | .id"); do
            gh api -X DELETE "repos/${GH_REPO}/releases/${old_id}"
          done

          RELEASE_ID="$(gh api -X POST "repos/${GH_REPO}/releases" \
            -f tag_name="${TAG}" \
            -f target_commitish="${{ github.sha }}" \
            -f name="ProtoForm ${TAG}" \
            -F draft=true \
            -F generate_release_notes=true \
            --jq '.id')"

          if [ -z "$RELEASE_ID" ]; then
            echo "Failed to create draft release for ${TAG}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"
      - uses: sbt/setup-sbt@v1
      - name: Install WiX Toolset v3
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          Get-ChildItem "C:\Program Files*\WiX Toolset*\bin" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $_.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Build Windows portable zip & MSI/EXE installers
        shell: pwsh
        run: |
          .\packaging\package-windows.ps1 -InstallerType all -Version "${{ needs.prepare-release.outputs.version }}"
      - name: Upload Windows assets directly to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          shopt -s nullglob
          files=(dist/*.zip dist/*.msi dist/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Windows release assets found in dist/" >&2
            exit 1
          fi
          existing_assets="$(gh api --paginate "repos/${GH_REPO}/releases/${RELEASE_ID}/assets" --jq '.[] | "\(.id)\t\(.name)"' || true)"
          for f in "${files[@]}"; do
            fname="$(basename "$f")"
            while IFS=$'\t' read -r aid aname; do
              if [ -n "$aid" ] && [ "$aname" = "$fname" ]; then
                gh api -X DELETE "repos/${GH_REPO}/releases/assets/${aid}"
              fi
            done <<< "$existing_assets"
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}" \
              "https://uploads.github.com/repos/${GH_REPO}/releases/${RELEASE_ID}/assets?name=${fname}" >/dev/null
          done

  build-macos:
    needs: prepare-release
    strategy:
      matrix:
        include:
          - runner: macos-15
          - runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"
      - uses: sbt/setup-sbt@v1
      - name: Build macOS DMG & portable zip
        run: |
          chmod +x packaging/package-unix.sh
          ./packaging/package-unix.sh "${{ needs.prepare-release.outputs.version }}"
      - name: Upload macOS assets directly to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No macOS release assets found in dist/" >&2
            exit 1
          fi
          existing_assets="$(gh api --paginate "repos/${GH_REPO}/releases/${RELEASE_ID}/assets" --jq '.[] | "\(.id)\t\(.name)"' || true)"
          for f in "${files[@]}"; do
            fname="$(basename "$f")"
            while IFS=$'\t' read -r aid aname; do
              if [ -n "$aid" ] && [ "$aname" = "$fname" ]; then
                gh api -X DELETE "repos/${GH_REPO}/releases/assets/${aid}"
              fi
            done <<< "$existing_assets"
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}" \
              "https://uploads.github.com/repos/${GH_REPO}/releases/${RELEASE_ID}/assets?name=${fname}" >/dev/null
          done

  build-linux:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"
      - uses: sbt/setup-sbt@v1
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot binutils zip
      - name: Build Linux DEB, portable zip & universal fat JAR
        run: |
          chmod +x packaging/package-unix.sh
          ./packaging/package-unix.sh "${{ needs.prepare-release.outputs.version }}"
          sbt -Dprotoform.universal=true assembly
          cp target/scala-3.3.7/protoform-*.jar dist/
      - name: Upload Linux & universal JAR assets directly to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          shopt -s nullglob
          files=(dist/*.deb dist/*.zip dist/*.jar)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Linux release assets found in dist/" >&2
            exit 1
          fi
          existing_assets="$(gh api --paginate "repos/${GH_REPO}/releases/${RELEASE_ID}/assets" --jq '.[] | "\(.id)\t\(.name)"' || true)"
          for f in "${files[@]}"; do
            fname="$(basename "$f")"
            while IFS=$'\t' read -r aid aname; do
              if [ -n "$aid" ] && [ "$aname" = "$fname" ]; then
                gh api -X DELETE "repos/${GH_REPO}/releases/assets/${aid}"
              fi
            done <<< "$existing_assets"
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}" \
              "https://uploads.github.com/repos/${GH_REPO}/releases/${RELEASE_ID}/assets?name=${fname}" >/dev/null
          done

  finalize-release:
    needs: [prepare-release, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Generate SHA256SUMS.txt & publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          mkdir -p release-assets
          while IFS=$'\t' read -r aid aname; do
            [ -z "$aid" ] && continue
            if [ "$aname" = "SHA256SUMS.txt" ]; then
              gh api -X DELETE "repos/${GH_REPO}/releases/assets/${aid}"
              continue
            fi
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/${GH_REPO}/releases/assets/${aid}" \
              -o "release-assets/${aname}"
          done < <(gh api --paginate "repos/${GH_REPO}/releases/${RELEASE_ID}/assets" --jq '.[] | "\(.id)\t\(.name)"')

          (cd release-assets && sha256sum * > SHA256SUMS.txt)

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@release-assets/SHA256SUMS.txt" \
            "https://uploads.github.com/repos/${GH_REPO}/releases/${RELEASE_ID}/assets?name=SHA256SUMS.txt" >/dev/null

          gh api -X PATCH "repos/${GH_REPO}/releases/${RELEASE_ID}" \
            -F draft=false \
            -f make_latest="true" >/dev/null
