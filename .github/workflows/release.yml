name: Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without leading v)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: sbt/setup-sbt@v1
      - name: Install WiX Toolset v3
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          Get-ChildItem "C:\Program Files*\WiX Toolset*\bin" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $_.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Build Windows portable zip & MSI/EXE installers
        shell: pwsh
        run: |
          .\packaging\package-windows.ps1 -InstallerType all -Version "${{ needs.prepare-release.outputs.version }}"
      - name: Verify Windows release assets
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Extension -in @('.zip', '.msi', '.exe') }
          if (-not $files) { throw "No Windows release assets found in dist/" }
      - name: Upload Windows workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*.zip
            dist/*.msi
            dist/*.exe
          if-no-files-found: error

  build-macos:
    needs: prepare-release
    strategy:
      matrix:
        include:
          - runner: macos-15
          - runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: sbt/setup-sbt@v1
      - name: Build macOS DMG & portable zip
        run: |
          chmod +x packaging/package-unix.sh
          ./packaging/package-unix.sh "${{ needs.prepare-release.outputs.version }}"
      - name: Verify macOS release assets
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No macOS release assets found in dist/" >&2
            exit 1
          fi
      - name: Upload macOS workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.runner }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  build-linux:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: sbt/setup-sbt@v1
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot binutils zip
      - name: Build Linux DEB, portable zip & universal fat JAR
        run: |
          chmod +x packaging/package-unix.sh
          ./packaging/package-unix.sh "${{ needs.prepare-release.outputs.version }}"
          sbt -Dprotoform.universal=true assembly
          cp target/scala-3.3.3/protoform-*.jar dist/
      - name: Verify Linux release assets
        run: |
          shopt -s nullglob
          files=(dist/*.deb dist/*.zip dist/*.jar)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Linux release assets found in dist/" >&2
            exit 1
          fi
      - name: Upload Linux workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.deb
            dist/*.zip
            dist/*.jar
          if-no-files-found: error

  finalize-release:
    needs: [prepare-release, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt & publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ needs.prepare-release.outputs.tag }}"
          rm -f release-assets/SHA256SUMS.txt
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" release-assets/* --title "ProtoForm ${TAG}" --generate-notes --latest
